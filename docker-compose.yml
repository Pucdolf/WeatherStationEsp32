version: "3.8"
services:
   db:
      image: postgres:latest
      container_name: weather32_db
      environment:
         POSTGRES_USER: admin
         POSTGRES_PASSWORD: password123
         POSTGRES_DB: weather_station
      ports:
         - "5432:5432"
      volumes:
         - postgres_data:/var/lib/postgresql
volumes:
   postgres_data:
